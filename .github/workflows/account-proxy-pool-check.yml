name: Account proxy pool checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/account-proxy-pool-check.yml'

permissions:
  contents: read

concurrency:
  group: account-proxy-pool-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOMEMLIMIT: 3GiB

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate schema and format changed Go files
        run: |
          (cd backend && go generate ./ent)
          git add -N backend/ent
          base="${{ github.event.pull_request.base.sha || 'origin/dev-czc' }}"
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary > "$RUNNER_TEMP/proxy-pool-generated.patch"
      - name: Proxy pool race and persistence regressions
        working-directory: backend
        run: go test -race -tags=unit ./internal/repository ./internal/service ./internal/handler ./internal/handler/admin -run '^(TestProxyPool|TestAccountProxy|Test.*Pool.*Proxy|Test.*Proxy.*Pool)' -count=1 -json > "$RUNNER_TEMP/proxy-pool-tests.jsonl"
      - name: Require committed schema and formatting
        run: test ! -s "$RUNNER_TEMP/proxy-pool-generated.patch"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proxy-pool-validation
          path: |
            ${{ runner.temp }}/proxy-pool-generated.patch
            ${{ runner.temp }}/proxy-pool-tests.jsonl
          retention-days: 7
