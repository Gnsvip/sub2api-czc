name: Google restoration checks

on:
  push:
    branches: [feature/restore-google-platforms]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-restoration-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOMEMLIMIT: 3GiB

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Compile shared packages
        working-directory: backend
        run: go build ./internal/...
      - name: Generate dependency wiring
        working-directory: backend
        run: go generate ./cmd/server
      - name: Compile restored services and tests
        working-directory: backend
        run: go test -tags=unit ./... -run '^$'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: google-generated-wiring
          path: backend/cmd/server/wire_gen.go
          retention-days: 7
