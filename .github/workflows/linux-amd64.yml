name: Verified Linux amd64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-linux-amd64-${{ github.ref }}
  cancel-in-progress: false

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOMEMLIMIT: 3GiB

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Google restoration regression checks
        working-directory: backend
        run: go test -tags=unit ./internal/service -run '^(TestAdminService_.*InvalidRequestFallback|TestSetAntigravityModelRateLimits_Image|TestValidateCreateParams_CheckModeMatrix|TestApplyMonitorUpdate_ProviderOnlyRevalidatesCheckMode|TestMatchingPlatforms|TestCompositeGroupSchedulerHasAllCanonicalPlatformBuckets|TestCacheStoragePricePerTokenHourPriority|TestPlatformListDerived|TestScheduler|TestTokenRefreshService_Registrations)' -count=1 -json > "$RUNNER_TEMP/google-focused.jsonl"
      - name: Unit tests
        working-directory: backend
        run: |
          set -o pipefail
          go test -tags=unit ./... -count=1 -json > "$RUNNER_TEMP/backend-tests.jsonl"
      - name: Migration, billing and account integration tests
        working-directory: backend
        env:
          CI: 'true'
        run: |
          # Standalone billing/soft-delete tests commit fixtures. Run the list
          # suite in a fresh harness database so its exact counts stay isolated.
          go test -tags=integration ./internal/repository -run 'TestMigrationsRunner_|Test.*Billing|Test.*Subscription|Test.*AccountAutoReset|Test.*GroupModel|TestGeminiCachedContentRepository_' -skip '^TestUserSubscriptionRepoSuite$' -count=1 -json > "$RUNNER_TEMP/integration-tests.jsonl"
          go test -tags=integration ./internal/repository -run '^TestUserSubscriptionRepoSuite$' -count=1 -json > "$RUNNER_TEMP/subscription-tests.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-validation
          path: |
            ${{ runner.temp }}/google-focused.jsonl
            ${{ runner.temp }}/backend-tests.jsonl
            ${{ runner.temp }}/integration-tests.jsonl
            ${{ runner.temp }}/subscription-tests.jsonl
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run lint:check
      - name: Frontend tests
        working-directory: frontend
        run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/frontend-tests.json"
      - run: pnpm --dir frontend run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-validation
          path: ${{ runner.temp }}/frontend-tests.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 7

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: migration_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Rehearse the existing schema without production data
        env:
          SCHEMA_PART_1: ${{ secrets.REHEARSAL_SCHEMA_PART_1 }}
          SCHEMA_PART_2: ${{ secrets.REHEARSAL_SCHEMA_PART_2 }}
          MIGRATIONS_B64: ${{ secrets.REHEARSAL_MIGRATIONS }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REHEARSAL_DSN: postgres://postgres:ci-only-password@127.0.0.1:5432/migration_rehearsal?sslmode=disable
        run: bash .github/release-tools/rehearse-migration.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-validation
          path: ${{ runner.temp }}/migration-result.txt
          retention-days: 7

  build:
    needs: [backend, frontend, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - name: Build Linux amd64 only
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../release-output
          version=$(sh scripts/resolve-version.sh)
          release_url=$(sh scripts/resolve-release-url.sh)
          go build -tags embed -trimpath -ldflags="-s -w -X main.Version=$version -X main.Commit=$GITHUB_SHA -X main.ReleaseURL=$release_url -X main.BuildType=release" -o ../release-output/sub2api ./cmd/server
          ../release-output/sub2api --version
      - name: Package and verify explicit allowlist
        run: |
          version=$(cat backend/cmd/server/VERSION | tr -d '\r\n')
          cp LICENSE release-output/LICENSE
          cp deploy/config.example.yaml release-output/config.example.yaml
          cp deploy/sub2api.service release-output/sub2api.service
          cd release-output
          tar -czf "sub2api_${version}_linux_amd64.tar.gz" sub2api LICENSE config.example.yaml sub2api.service
          tar -tzf "sub2api_${version}_linux_amd64.tar.gz" > manifest.txt
          printf 'sub2api\nLICENSE\nconfig.example.yaml\nsub2api.service\n' | diff - manifest.txt
          sha256sum "sub2api_${version}_linux_amd64.tar.gz" > checksums.txt
          sha256sum -c checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: |
            release-output/*.tar.gz
            release-output/checksums.txt
            release-output/manifest.txt
          retention-days: 14
