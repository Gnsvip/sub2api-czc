name: Temporary OAuth message ID regression
on:
  push:
    branches: [fix/oauth-message-id]
permissions:
  contents: read
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOMEMLIMIT: 3GiB
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Reproduce against the previous implementation, then verify the fix
        shell: bash
        run: |
          set -euo pipefail
          files=(backend/internal/service/openai_responses_item_id.go backend/internal/service/openai_codex_transform.go)
          restore() { for file in "${files[@]}"; do cp "$RUNNER_TEMP/$(basename "$file")" "$file"; done; }
          for file in "${files[@]}"; do cp "$file" "$RUNNER_TEMP/$(basename "$file")"; done
          trap restore EXIT
          for file in "${files[@]}"; do git show "434e663f8:$file" > "$file"; done
          set +e
          (cd backend && go test -tags=unit ./internal/service -run '^(TestFilterCodexInput_MessageIDsRespectTypeWithNativeReplay|TestOpenAIGatewayService_OAuthForward_StripsInvalidMessageIDs|TestNormalizeOpenAIResponsesWebSocketCompatibilityBody_OAuthMessageIDs)$' -count=1 -json) > "$RUNNER_TEMP/baseline.jsonl"
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import json, os
          failures = set()
          for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'baseline.jsonl')):
              event = json.loads(line)
              if event.get('Action') == 'fail' and event.get('Test'):
                  failures.add(event['Test'].split('/')[0])
          expected = {'TestFilterCodexInput_MessageIDsRespectTypeWithNativeReplay', 'TestOpenAIGatewayService_OAuthForward_StripsInvalidMessageIDs', 'TestNormalizeOpenAIResponsesWebSocketCompatibilityBody_OAuthMessageIDs'}
          assert failures == expected, failures
          print('Reproduced all three message ID regressions against the previous implementation.')
          PY
          restore
          (cd backend && go test -race -tags=unit ./internal/service -run '^(TestFilterCodexInput|TestOpenAIGatewayService_.*(ItemID|MessageID)|TestNormalizeOpenAIResponsesWebSocketCompatibilityBody|TestNativeReasoningReplayIdentity|TestCodexNativeInput)' -count=1 -json) > "$RUNNER_TEMP/fixed.jsonl"
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oauth-message-id-regression
          path: |
            ${{ runner.temp }}/baseline.jsonl
            ${{ runner.temp }}/fixed.jsonl
          retention-days: 14
