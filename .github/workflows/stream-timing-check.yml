name: HTTP timing and ingress regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/internal/pkg/httputil/**'
      - 'backend/internal/handler/request_body_read_log*.go'
      - 'backend/internal/server/middleware/request_body_read_error.go'
      - 'backend/internal/server/middleware/group_model_allowlist_test.go'
      - 'backend/internal/server/middleware/openai_fast_policy_forwarding_test.go'
      - 'backend/internal/service/openai_*timing*.go'
      - 'backend/internal/service/openai_compact_sse_keepalive*.go'
      - 'backend/internal/service/openai_gateway_response_handling.go'
      - 'backend/internal/service/openai_gateway_passthrough.go'
      - 'backend/internal/service/openai_gateway_chat_completions.go'
      - 'backend/internal/repository/http_upstream.go'
      - '.github/workflows/stream-timing-check.yml'

permissions:
  contents: read

concurrency:
  group: stream-timing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOMEMLIMIT: 3GiB

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check diagnostic formatting
        working-directory: backend
        run: |
          test -z "$(gofmt -l internal/service/openai_stream_timing.go internal/service/openai_forward_timing.go internal/service/openai_slow_timing_store.go internal/service/openai_compact_sse_keepalive_test.go)"
          test -z "$(gofmt -l internal/pkg/httputil/body.go internal/pkg/httputil/body_read_error.go internal/pkg/httputil/body_memory_test.go internal/pkg/httputil/body_read_error_test.go internal/handler/request_body_read_log.go internal/handler/request_body_read_log_test.go internal/server/middleware/request_body_read_error.go internal/server/middleware/group_model_allowlist_test.go)"
      - name: Upload progress and request-body race regressions
        working-directory: backend
        run: |
          go test -race -tags=unit ./internal/pkg/httputil ./internal/server/middleware -count=1 -json > "$RUNNER_TEMP/upload-tests.jsonl"
          go test -race -tags=unit ./internal/handler -run '^(TestLogRequestBodyReadFailure|TestWriteRequestBodyReadFailure|TestReadRequestBody|Test.*BodyLimit)' -count=1 -json >> "$RUNNER_TEMP/upload-tests.jsonl"
      - name: Streaming, diagnostics and transport race regressions
        working-directory: backend
        run: |
          go test -race -tags=unit ./internal/service ./internal/repository -run '^(TestOpenAISlowTiming|Test.*OpenAI.*Keepalive|TestOpenAIFirstOutput|TestOpenAINativeFirstOutput|TestOpenAIPassthrough|TestOpenAIGatewayService_.*Streaming|TestHandleChatStreamingResponse|TestHTTPUpstream|TestDecompressResponseBody|TestCodexOwnedH2)' -count=1 -json > "$RUNNER_TEMP/stream-timing-tests.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stream-timing-validation
          path: |
            ${{ runner.temp }}/stream-timing-tests.jsonl
            ${{ runner.temp }}/upload-tests.jsonl
          retention-days: 7
