name: Upstream integration bootstrap
on:
  push:
    branches: [sync/upstream-20261113]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-bootstrap-${{ github.ref }}
  cancel-in-progress: true
env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
  GOMEMLIMIT: 3GiB
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate merged Ent schema
        working-directory: backend
        run: go generate ./ent
      - name: Format changed Go sources
        run: git diff --name-only -z --diff-filter=ACMR 672272e18592d72be4747a9ed1ab8185d4eb8d4f -- '*.go' | xargs -0 -r gofmt -w
      - name: Generate merged dependency wiring
        working-directory: backend/cmd/server
        run: go run -mod=mod github.com/google/wire/cmd/wire
      - name: Compile all unit tests
        working-directory: backend
        run: go test -gcflags='github.com/Wei-Shaw/sub2api/...=-e' -tags=unit ./... -run '^$' > "$RUNNER_TEMP/compile.log" 2>&1
      - name: Customized upstream compatibility regressions
        working-directory: backend
        run: go test -tags=unit ./internal/config ./internal/handler ./internal/handler/admin ./internal/server ./internal/service -run '^(TestValidateClaudeMimic|TestUpdateSettings.*ClaudeCodeVersion|TestGrokVoiceRequestBody|TestRequestBodyRead|TestOpenAIGatewayServiceRecordUsage_GPT61TerraLongContextBoundary|TestOpenAIResponsesInstructionsEcho|TestOpenAIGatewayService_OAuth.*Instructions|TestProxyOpenAIWSHTTPBridgeTurn_StagesCodexFingerprint|TestOpenAIWSHTTPBridgeLaterTurn429RetriesCurrentTurnOnReplacementAccount|TestSelect.*ImageSize|TestSelectAccountWithScheduler.*SizeRouting|TestSelectAccountWithSchedulerForImages)' -count=1 -json > "$RUNNER_TEMP/compatibility-focused.jsonl"
      - name: Export generator and formatter changes
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/generated.patch"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bootstrap-backend
          path: |
            ${{ runner.temp }}/generated.patch
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/compatibility-focused.jsonl
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run lint:check
      - run: pnpm --dir frontend run build
        if: success() || failure()
      - name: Frontend tests
        if: success() || failure()
        working-directory: frontend
        run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/frontend-tests.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bootstrap-frontend
          path: ${{ runner.temp }}/frontend-tests.json
          retention-days: 7
