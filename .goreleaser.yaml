version: 2
project_name: sub2api
builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags: [-tags=embed, -trimpath]
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
archives:
  - id: default
    format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_amd64'
    files:
      - LICENSE
      - deploy/config.example.yaml
      - deploy/sub2api.service
checksum:
  name_template: checksums.txt
  algorithm: sha256
changelog:
  disable: true
# Four-component versions use the workflow packaging step, not GoReleaser.
