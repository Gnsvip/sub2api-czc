# Include once inside http {}. No request body, URL query, IP or credential is logged.
map $host $sub2api_upload_host {
    default other;
    api.aifxo.com api.aifxo.com;
    aifxo.com aifxo.com;
    www.aifxo.com www.aifxo.com;
}

map $uri $sub2api_upload_route {
    default "";
    ~^/(v1/|backend-api/codex/)?responses$ responses;
    ~^/(v1/|backend-api/codex/)?responses/compact$ compact;
    ~^/(v1/)?chat/completions$ chat;
    ~^/(v1/|antigravity/v1/)?messages(/count_tokens)?$ messages;
    ~^/(v1/)?images/(generations|edits|variations)(/async)?$ images;
    ~^/(antigravity/)?v1beta/models/[^/]+:(generateContent|streamGenerateContent)$ gemini;
}

# A 499 can also be a downstream disconnect AFTER an upload; do not label all
# records as upload timeouts. request_complete and upstream_status help distinguish it.
map "$request_method:$sub2api_upload_route:$status" $sub2api_upload_loggable {
    default 0;
    ~^POST:(responses|compact|chat|messages|images|gemini):(408|499)$ 1;
}

map $http_content_encoding $sub2api_upload_encoding {
    default other;
    "" identity;
    ~*^identity$ identity;
    ~*^(gzip|x-gzip)$ gzip;
    ~*^zstd$ zstd;
    ~*^deflate$ deflate;
}

# Restrict externally supplied identifiers before they reach the log transport.
map $http_x_client_request_id $sub2api_upload_client_id {
    default "";
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $http_x_client_request_id;
}
map $upstream_http_x_request_id $sub2api_upload_app_id {
    default "";
    "~^[0-9a-fA-F]{32}$" $upstream_http_x_request_id;
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $upstream_http_x_request_id;
}
map $upstream_http_x_client_request_id $sub2api_upload_app_client_id {
    default "";
    "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $upstream_http_x_client_request_id;
}
map $http_cf_ray $sub2api_upload_ray {
    default "";
    "~^[0-9a-fA-F]{16}-[A-Z]{3}$" $http_cf_ray;
}

log_format sub2api_upload escape=json
    '{"nginx_time":"$msec","edge_request_id":"$request_id",'
    '"app_request_id":"$sub2api_upload_app_id","incoming_client_request_id":"$sub2api_upload_client_id",'
    '"app_client_request_id":"$sub2api_upload_app_client_id",'
    '"edge_ray":"$sub2api_upload_ray","host":"$sub2api_upload_host",'
    '"route":"$sub2api_upload_route","status":"$status","client_protocol":"$server_protocol",'
    '"encoding":"$sub2api_upload_encoding","declared_body_bytes":"$http_content_length",'
    '"request_bytes_including_headers":"$request_length","request_complete":"$request_completion",'
    '"request_seconds":"$request_time","upstream_status":"$upstream_status",'
    '"upstream_seconds":"$upstream_response_time",'
    '"upstream_bytes_sent_including_headers":"$upstream_bytes_sent"}';
