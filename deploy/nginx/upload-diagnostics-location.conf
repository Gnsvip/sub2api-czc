# Include in EXISTING API proxy locations, alongside their proxy_set_header lines.
# Keep proxy_pass, routing, request/response buffering and timeouts unchanged.
# Repeat any inherited proxy headers / access logs at this level before including.
# Remove an access_log off at this SAME level, otherwise it disables this log too.
proxy_set_header X-Request-ID $request_id;
access_log syslog:server=unix:/run/sub2api-upload-diagnostics/access.sock,facility=local7,tag=sub2api_upload,nohostname sub2api_upload if=$sub2api_upload_loggable;
